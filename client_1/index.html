<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Harmony</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-banner">
            <a href="index.html">
                <img src="images/Home.png" alt="Home Harmony Logo" class="logo-img">
            </a>
        </div>
        <h1 class="site-title">Home Harmony</h1>

        <nav class="nav-bar">
            <a href="index.html#about" class="nav-btn">About Us</a>
            <a href="booking.html#services" class="nav-btn">Services</a>
            <a href="index.html#survey" class="nav-btn">Question</a>
            <a href="booking.html#booking-form" class="nav-btn">Contact</a>
        </nav>
    </header>

    <main>
        <section id="about" class="content-section">
            <h2>About Us</h2>
            <p>Helping families one chore at a time.</p>
        </section>

        <section class="content-section">
            <h2>Our Mission</h2>
            <p>Bringing balance and order back to your home lifestyle.</p>
        </section>

        <!-- Interactive Question Section -->
        <section id="survey" class="survey-section">
            <h2>How often do you find yourself overwhelmed with household tasks?</h2>
            <div class="survey-options">
                <button class="survey-btn" type="button">Never</button>
                <button class="survey-btn" type="button">Rarely</button>
                <button class="survey-btn" type="button">Sometimes</button>
                <button class="survey-btn" type="button">Often</button>
                <button class="survey-btn" type="button">Always</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Home Harmony. All rights reserved.</p>
    </footer>
</body>
</html>

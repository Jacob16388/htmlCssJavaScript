<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Character encoding and viewport for responsive design -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Media Task</title>
  <!-- The block below is CSS. It only draws borders on tables so you can
       see rows and cells. CSS is Lesson 05 - leave this alone for now. -->
  <style>
    table, th, td { border: 1px solid #333; border-collapse: collapse; }
    th, td { padding: 6px; }
  </style>
</head>
<body>
<video width="400", height="300" controls>
<source src="videos/promoMoore.mp4" type="video/mp4">
</video>
<section id=video>
    <code>&lt;video&gt;</code>
</section>
<section id="audio">
<code>&lt;audio&gt;</code>
</section>
 <section id="formats">
    <h2>Media Format Reference</h2>
    <table>
      <tr>
        <th>Type</th>
        <th>Format</th>
        <th>File Extension</th>
        <th>MIME Type</th>
      </tr>
      <tr>
        <td>Video</td>
        <td>MP4 (most compatible)</td>
        <td>.mp4</td>
        <td>video/mp4</td>
      </tr>
      <tr>
        <td>Video</td>
        <td>WebM</td>
        <td>.webm</td>
        <td>video/webm</td>
      </tr>
      <tr>
        <td>Audio</td>
        <td>MP3 (most compatible)</td>
        <td>.mp3</td>
        <td>audio/mpeg</td>
      </tr>
      <tr>
        <td>Audio</td>
        <td>OGG</td>
        <td>.ogg</td>
        <td>audio/ogg</td>
      </tr>
    </table>
  </section>

  <footer>
    <p>Task complete! Test all media elements in your browser.</p>
  </footer>

</body>
</html>
